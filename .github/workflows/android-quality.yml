name: Android quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36.1
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run quality checks
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
